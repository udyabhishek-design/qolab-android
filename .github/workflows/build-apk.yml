# Qolab Flutter app — Development APK build.
# Runs on pushes to flutter-go touching the app, plus manual dispatch.
# The PAT is NOT used here: builds run on the workflow's built-in
# GITHUB_TOKEN with contents:read. Nothing secret is committed.
name: build-apk

on:
  push:
    branches: [flutter-go]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK (Development)
        run: flutter build apk --debug --dart-define=QOLAB_ORIGIN=https://workpulse-gbpedt.drytis.dev

      - uses: actions/upload-artifact@v4
        with:
          name: qolab-dev-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
