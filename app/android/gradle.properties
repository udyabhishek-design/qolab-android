org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -XX:+AlwaysActAsServerClassMachine -XX:CompressedClassSpaceSize=64m -Xss512k
# 4 GB container cgroup: compile Kotlin in-process (no separate 2 GB Kotlin
# daemon that the OOM killer targets) and use a single Gradle worker.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
