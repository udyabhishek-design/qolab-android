org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:+AlwaysActAsServerClassMachine
# 4 GB container cgroup: compile Kotlin in-process (no separate 2 GB Kotlin
# daemon that the OOM killer targets) and use a single Gradle worker.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
