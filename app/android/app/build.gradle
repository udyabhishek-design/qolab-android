plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Phase C3A — Firebase (google-services.json in this module)
    id "com.google.gms.google-services"
}

android {
    namespace = "dev.qolab.qolab_app"
    // LiveKit/flutter_webrtc and friends declare NDK 27 / SDK 36; these
    // supersede the Flutter 3.27.4 defaults (35 / 26.1). Backward compatible.
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "dev.qolab.qolab_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // flutter_secure_storage requires minSdk 23 (Android 6.0+).
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

// Phase C3A — the app module has its own native FirebaseMessagingService
// (QolabFirebaseMessagingService.java in src/main/java). The
// firebase_messaging plugin exposes com.google.firebase:firebase-messaging
// with `implementation` scope, which is NOT on the app module's javac
// classpath — the service cannot compile without this direct declaration.
// (v1.5.61 failed the other way: the .java sources were never compiled at
// all; BOTH halves are needed: sources under src/main/java + this dep.)
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

flutter {
    source = "../.."
}
